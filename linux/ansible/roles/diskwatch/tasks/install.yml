---
- name: Install duc
  ansible.builtin.apt:
    name: duc
    state: present
    update_cache: true
    cache_valid_time: 86400
  tags: [diskwatch, diskwatch_packages]

- name: Install diskwatch script
  ansible.builtin.copy:
    src: diskwatch
    dest: "{{ diskwatch_bin }}"
    owner: root
    group: root
    mode: "0755"
  tags: [diskwatch, diskwatch_script]

- name: Install duc-ui (vim-key browser) for this Debian release
  ansible.builtin.include_tasks:
    file: duc_ui.yml
    apply:
      tags: [diskwatch, diskwatch_ui]
  tags: [diskwatch, diskwatch_ui]

- name: Write diskwatch settings
  ansible.builtin.template:
    src: default.j2
    dest: /etc/default/diskwatch
    owner: root
    group: root
    mode: "0644"
  tags: [diskwatch, diskwatch_config]

- name: Create diskwatch data directory
  ansible.builtin.file:
    path: "{{ diskwatch_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [diskwatch, diskwatch_config]

- name: Install diskwatch systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - diskwatch-scan.service
    - diskwatch-scan.timer
    - diskwatch-sample.service
    - diskwatch-sample.timer
  notify: Reload systemd
  tags: [diskwatch, diskwatch_systemd]

- name: Reload systemd before enabling timers
  ansible.builtin.meta: flush_handlers
  tags: [diskwatch, diskwatch_systemd]

- name: Enable and start diskwatch timers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: [diskwatch-scan.timer, diskwatch-sample.timer]
  ignore_errors: "{{ ansible_check_mode }}"  # units are not written in check mode
  tags: [diskwatch, diskwatch_systemd]

- name: Check for an existing diskwatch index
  ansible.builtin.stat:
    path: "{{ diskwatch_data_dir }}/duc.db"
  register: diskwatch_index
  when: diskwatch_first_scan | bool
  tags: [diskwatch, diskwatch_scan]

- name: Start a first index in the background
  ansible.builtin.systemd_service:
    name: diskwatch-scan.service
    state: started
    no_block: true
  when: diskwatch_first_scan | bool and not diskwatch_index.stat.exists
  tags: [diskwatch, diskwatch_scan]
